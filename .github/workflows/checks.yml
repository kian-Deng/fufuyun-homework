name: Build and integration checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.3
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only-password
          MYSQL_DATABASE: homework_assistant_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-test-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-test-only-password
      DB_NAME: homework_assistant_test
      RUN_MYSQL_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=optional
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: bash scripts/test-manage.sh
      - run: docker build -f Dockerfile.api -t fufuyun-homework-api:ci .
      - run: docker build -f Dockerfile.web -t fufuyun-homework-web:ci .
      - name: Validate HTTPS configuration syntax
        run: docker run --rm -e HTTPS_DOMAIN=homework.example.com -v "$PWD/deploy/Caddyfile.https:/etc/caddy/Caddyfile:ro" fufuyun-homework-web:ci caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /dev/null
